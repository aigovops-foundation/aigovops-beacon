name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run that also exercises the gated scale layer.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  server:
    name: server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is here because its ABSENCE is what let the quickstart break. Node 20 and 22
        # both install better-sqlite3 from a prebuilt binary, so this matrix stayed green
        # for months while `cd server && npm install` — the first command in README.md —
        # died compiling it on Node 24 and 26. The lane that reproduces the user's
        # environment is the one that has to exist.
        #
        # Each version also exercises a different driver: 20 has no node:sqlite so it runs
        # better-sqlite3, 22 has both, 24 runs the built-in.
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --no-audit --no-fund
      # `npm test` uses node --test auto-discovery, which runs unit, E2E,
      # and chaos suites under server/test (works on Node 20 and 22).
      - run: npm test

  python:
    name: python tests (unit + E2E + chaos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Python E2E spawns the Node server as a subprocess, so we need both
      # runtimes available and the server's dependencies installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: server
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Excludes the gated scale layer (pytest.ini sets -m "not scale").
      - run: python -m pytest -v

  scale:
    name: python scale (gated)
    # Only on manual dispatch or the weekly schedule — not on every PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -m scale tests/scale -v

  studio:
    name: studio build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22, not 20, because react-router 8 declares `engines: node >=22.22.0`. Clearing the
          # react-router advisories required 8.x (see studio/package.json), and 8.x is the first
          # line that carries that floor. This bump is scoped to the Studio build only — the
          # server matrix and the runtime image stay on 20.
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      # `npm ci` needs the lockfile, and so did the cache line above — which is why this job
      # failed at setup-node with "Some specified paths were not resolved": studio/package-lock.json
      # had never been committed. `npm install` also resolved fresh versions on every run, so the
      # thing CI built was not necessarily the thing anyone had tested.
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [server, studio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: aigovops/beacon:ci
